[package]
name = "fatcrash-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for fatcrash-core via PyO3"
license = "MIT"
repository = "https://github.com/lambdaclass/fatcrash"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
fatcrash-core = { path = "../fatcrash-core" }
pyo3 = { version = "0.25", features = ["extension-module"] }
numpy = "0.25"
rayon = { workspace = true }
