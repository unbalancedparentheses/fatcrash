[package]
name = "fatcrash-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI dashboard for fatcrash crash detection signals"
license = "MIT"
repository = "https://github.com/lambdaclass/fatcrash"

[[bin]]
name = "fatcrash-tui"
path = "src/main.rs"

[dependencies]
fatcrash-core = { path = "../fatcrash-core" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
md-5 = "0.10"
rayon = { workspace = true }
dirs = "6"
